<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFE9D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="東京日語">
<title>東京日語衝刺 🏮</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏮</text></svg>">
<style>
/* ==========================================================================
   東京旅遊日語 30 天衝刺 — 樣式（手機優先）
   ========================================================================== */
:root{
  --primary:#E8503A;
  --primary-d:#C93F2C;
  --accent:#2E86AB;
  --green:#35B37E;
  --yellow:#F5A623;
  --red:#E5484D;
  --gray:#C9CDD4;
  --bg:#FFF6EC;
  --bg2:#FFE9D6;
  --card:#FFFFFF;
  --text:#2B2724;
  --muted:#8C857D;
  --line:rgba(0,0,0,.07);
  --shadow:0 4px 18px rgba(180,120,80,.13);
  --radius:20px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:linear-gradient(170deg,var(--bg2) 0%,var(--bg) 32%,var(--bg) 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.6;
  min-height:100vh;
}
#app{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.jp,.jp-big,.jp-quiz,.kana,.sign,.bubble-jp,.br-jp,.bubble-kana{
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
}

h2{font-size:22px;margin:6px 0 8px;line-height:1.35}
h3{font-size:17px;margin:0 0 10px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.xsmall{font-size:11.5px}
.center{text-align:center}
.pad{height:40px}
.warn{color:var(--primary)}

/* ---------- 頂列 ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.brand{flex:1;font-weight:700;font-size:17px}
.counter{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.icon-btn{
  border:none;background:rgba(255,255,255,.8);width:38px;height:38px;border-radius:12px;
  font-size:17px;cursor:pointer;box-shadow:var(--shadow);flex:none;
}

/* ---------- 卡片 ---------- */
.card{
  background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:14px;
  box-shadow:var(--shadow);
}
.card.hero{text-align:center;padding:28px 22px}
.hero-emoji{font-size:42px;line-height:1}
.hero-emoji.big{font-size:64px}
.card.danger{border:1px solid rgba(229,72,77,.25)}
.big-emoji{font-size:32px}

/* ---------- 倒數 ---------- */
.countdown{
  text-align:center;padding:14px 0 22px;
}
.cd-num{
  font-size:76px;font-weight:800;line-height:.95;letter-spacing:-3px;
  background:linear-gradient(135deg,var(--primary),#F5A623);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.cd-label{color:var(--muted);font-size:14px;letter-spacing:1px}

/* ---------- 按鈕 ---------- */
.btn{
  display:block;width:100%;border:none;border-radius:16px;padding:14px 18px;
  font-size:16px;font-weight:700;cursor:pointer;margin-top:10px;
  background:#F1EDE8;color:var(--text);font-family:inherit;
  transition:transform .08s ease,filter .15s ease;
}
.btn:active{transform:scale(.975)}
.btn.big{padding:17px 18px;font-size:17px;border-radius:18px}
.btn.primary{background:linear-gradient(135deg,var(--primary),#F2703F);color:#fff;box-shadow:0 6px 16px rgba(232,80,58,.32)}
.btn.accent{background:linear-gradient(135deg,#6B5B95,var(--accent));color:#fff;box-shadow:0 6px 16px rgba(46,134,171,.3)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;font-weight:600}
.btn.warn{background:rgba(229,72,77,.1);color:var(--red)}
.btn.small{width:auto;padding:9px 14px;font-size:14px;margin:0;flex:none}

/* ---------- 首頁 ---------- */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.row2 .card{margin:0;text-align:center;padding:18px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.stat-big{font-size:32px;font-weight:800;line-height:1.2}
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring-center{position:absolute;font-weight:800;font-size:18px}
.ring{display:block}

.phase-tag{
  display:inline-block;background:rgba(46,134,171,.12);color:var(--accent);
  padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700;margin-bottom:6px;
}
.due-line{margin:12px 0 2px;font-size:15px}

.scen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 6px;margin-top:4px}
.scen{text-align:center}
.scen-ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.scen-emoji{position:absolute;font-size:22px}
.scen-name{font-size:12.5px;font-weight:600;margin-top:2px}
.scen-num{font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:14px;justify-content:center;margin-top:16px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:99px;display:inline-block;flex:none}
.dot.green{background:var(--green)}.dot.yellow{background:var(--yellow)}.dot.gray{background:var(--gray)}

.tokyo-card{background:linear-gradient(135deg,#F7F2FF,#EAF4F9)}
.tokyo-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.tokyo-head h3{margin:0}
.locked{opacity:.62}
.lock-note{text-align:center;color:var(--muted);font-size:14px;padding:8px 0 2px}

.banner{
  background:#fff;border-left:4px solid var(--accent);border-radius:14px;padding:14px 16px;
  margin-bottom:14px;box-shadow:var(--shadow);font-size:14px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
}
.banner .btn{background:var(--accent);color:#fff}

.footnav{display:flex;gap:10px;margin-top:6px}
.footnav .btn{margin-top:0;font-size:14px;background:rgba(255,255,255,.7)}

/* ---------- 進度條 ---------- */
.progress{height:10px;background:rgba(0,0,0,.07);border-radius:99px;overflow:hidden;margin:14px 0 8px}
.progress.slim{height:5px;margin:0 0 14px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#F5A623);border-radius:99px;transition:width .4s}

/* ---------- 課程分段列 ---------- */
.segbar{display:flex;gap:6px;margin-bottom:16px}
.seg{
  flex:1;height:34px;border-radius:12px;background:rgba(255,255,255,.65);
  display:flex;align-items:center;justify-content:center;font-size:15px;opacity:.45;
}
.seg.done{opacity:1;background:rgba(53,179,126,.18)}
.seg.cur{opacity:1;background:#fff;box-shadow:var(--shadow);transform:scale(1.04)}
.counter-line{text-align:center;color:var(--muted);font-size:13px;margin-bottom:10px;font-variant-numeric:tabular-nums}

.badge{
  display:inline-block;padding:4px 12px;border-radius:99px;font-size:12.5px;font-weight:700;
}

/* ---------- 今日盤點三選一 ---------- */
.triage-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 10px}
.triage{
  border:none;border-radius:16px;padding:14px 4px;min-height:88px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-family:inherit;color:#fff;transition:transform .08s;
}
.triage:active{transform:scale(.95)}
.triage .t-emoji{font-size:22px;line-height:1}
.triage b{font-size:12.5px;font-weight:700;letter-spacing:-.3px;line-height:1.3}
.t-known{background:linear-gradient(135deg,var(--green),#4CC38A)}
.t-quick{background:linear-gradient(135deg,var(--yellow),#F7B955)}
.t-cold{background:linear-gradient(135deg,#F2743A,#E5684D)}

/* ---------- 翻卡 ---------- */
.flip{perspective:1200px;min-height:300px;margin-bottom:14px;cursor:pointer}
.flip-inner{position:relative;width:100%;min-height:300px;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:26px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:8px;overflow:auto;
}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#FFFDF8,#FFF3E6)}
.zh-big{font-size:27px;font-weight:700;line-height:1.45}
.say-hint{margin-top:10px;font-size:15px;color:var(--muted);line-height:1.5}
.jp-big{font-size:29px;font-weight:700;line-height:1.5;word-break:break-word}
.kana{font-size:17px;color:#6E675F}
.romaji{font-size:15px;color:var(--muted);font-style:italic}
.zh-small{font-size:15px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:10px;width:100%}
.tap-hint{font-size:14px;padding:6px 0 12px}
.tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700}
.tag.new{background:var(--primary);color:#fff}
.tag.spot{background:var(--accent);color:#fff}

/* ---------- 自評按鈕 ---------- */
.grades{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 20px}
.grade{
  border:none;border-radius:14px;padding:12px 2px;min-height:70px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:inherit;color:#fff;transition:transform .08s;
}
.grade:active{transform:scale(.94)}
.grade b{font-size:12.5px;font-weight:700;letter-spacing:-.3px;line-height:1.25}
.grade span{font-size:11px;opacity:.75}
.g0{background:#E5484D}
.g2{background:#F2743A}
.g3{background:#F5A623}
.g4{background:#7CC061}
.g5{background:#35B37E}

/* ---------- 選擇題 ---------- */
.quiz-card{text-align:center;padding:30px 20px}
.jp-quiz{font-size:28px;font-weight:700;line-height:1.5;margin:6px 0 4px}
.opts{display:grid;gap:10px;margin-bottom:14px}
.opt{
  border:2px solid var(--line);background:#fff;border-radius:16px;padding:15px 16px;
  font-size:15.5px;text-align:left;cursor:pointer;font-family:inherit;color:var(--text);
  transition:transform .08s,border-color .15s;
}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--green);background:rgba(53,179,126,.12);font-weight:700}
.opt.wrong{border-color:var(--red);background:rgba(229,72,77,.1)}

/* ---------- 漢字快閃 ---------- */
.sign-card{text-align:center;padding:34px 20px;background:linear-gradient(160deg,#FFFFFF,#F4F7FA)}
.sign{
  font-size:64px;font-weight:700;letter-spacing:4px;line-height:1.25;
  word-break:break-word;
}
@media(max-width:380px){.sign{font-size:52px}}

/* ---------- 對話 ---------- */
.intro{background:rgba(255,255,255,.7);border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:14.5px;line-height:1.6}
.narration{
  background:rgba(0,0,0,.04);border-radius:14px;padding:13px 16px;margin-bottom:12px;
  font-size:14.5px;color:#5F594F;line-height:1.65;
}
.npc{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.npc-avatar{font-size:26px;flex:none;background:#fff;width:44px;height:44px;border-radius:99px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.bubble{
  background:#fff;border-radius:4px 18px 18px 18px;padding:14px 16px;box-shadow:var(--shadow);flex:1;
}
.bubble-jp{font-size:19px;font-weight:600;line-height:1.55}
.bubble-kana{font-size:13.5px;color:#807A72;margin-top:2px}
.bubble-zh{font-size:14px;color:var(--muted);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.prompt-card{background:linear-gradient(160deg,#FFF9F0,#FFEFE0);border:1px dashed rgba(232,80,58,.3)}
.prompt{font-size:21px;font-weight:700;line-height:1.5;margin:4px 0 6px}
.answer-card{background:linear-gradient(160deg,#F5FBF8,#EDF7F2);text-align:center}
.tip{margin-top:12px;font-size:13.5px;color:#5F594F;background:rgba(245,166,35,.14);padding:10px 12px;border-radius:12px;text-align:left}
.station{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}

/* ---------- 錄音 ---------- */
.rec{margin-top:12px}
.rec-btn{background:rgba(0,0,0,.05);font-size:14px;padding:11px;margin-top:0}
.rec-btn.recording{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
.audio{width:100%;margin-top:10px;height:38px}

/* ---------- 完成慶祝 ---------- */
.celebrate{background:linear-gradient(160deg,#FFFDF6,#FFF0DE)}
.recap{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px;margin:18px 0}
.recap div{display:flex;flex-direction:column;gap:2px}
.recap b{font-size:22px}
.recap span{font-size:12px;color:var(--muted)}
.streak-line{font-size:15px;margin:6px 0}
.quote{margin-top:14px;font-size:14.5px;color:#5F594F;font-style:italic;background:rgba(0,0,0,.035);padding:12px;border-radius:12px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti span{
  position:absolute;top:-40px;font-size:26px;
  left:calc(8% + var(--i) * 15%);
  animation:fall 2.6s cubic-bezier(.3,.6,.5,1) forwards;
  animation-delay:calc(var(--i) * .16s);
}
@keyframes fall{
  0%{transform:translateY(0) rotate(0);opacity:0}
  12%{opacity:1}
  100%{transform:translateY(105vh) rotate(420deg);opacity:0}
}

/* ---------- 卡片庫 ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:none;background:rgba(255,255,255,.75);border-radius:99px;padding:9px 15px;
  font-size:13.5px;font-family:inherit;cursor:pointer;color:var(--muted);font-weight:600;
}
.chip.on{background:var(--primary);color:#fff}
.card.list{padding:6px 16px}
.browse-row{display:flex;gap:11px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.browse-row:last-child{border-bottom:none}
.br-main{flex:1;min-width:0}
.br-jp{font-size:17px;font-weight:600;line-height:1.4}
.br-kana{font-size:12px;color:#8C857D}
.br-zh{font-size:13.5px;color:#5F594F;margin-top:2px}
.br-meta{font-size:11.5px;color:var(--muted);flex:none;text-align:right}

/* ---------- 設定 ---------- */
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:none}
.switch{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 0;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--primary)}
.select{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-family:inherit;font-size:14px;background:#fff}
.input{
  width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:16px;
  font-family:inherit;margin:12px 0 4px;background:#fff;color:var(--text);
}
.input:focus{outline:none;border-color:var(--primary)}
code{
  background:rgba(0,0,0,.05);padding:1px 6px;border-radius:6px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;
}

/* ---------- 同步碼 ---------- */
.synccode{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:21px;font-weight:700;letter-spacing:1.5px;text-align:center;
  background:linear-gradient(160deg,#F7F2FF,#EAF4F9);
  border:1px dashed rgba(46,134,171,.4);border-radius:14px;
  padding:16px 10px;margin:12px 0 6px;cursor:pointer;user-select:all;
  word-break:break-all;
}
.synccode:active{transform:scale(.99)}
.sync-link{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.sync-link .input{margin:0 0 8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}
.sync-link .btn{margin-top:0}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:rgba(30,26,22,.93);color:#fff;padding:12px 20px;border-radius:99px;
  font-size:14px;opacity:0;transition:.28s;pointer-events:none;z-index:100;
  max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 桌面 ---------- */
@media(min-width:640px){
  #app{padding-top:24px}
  .cd-num{font-size:88px}
}

</style>
</head>

<script>

<script>
/* ==========================================================================
   東京旅遊日語 30 天衝刺 — 內容資料庫
   欄位格式：[jp, kana, romaji, zh, star]
   star = 1 代表高頻卡（Day 28–30 精煉用）
   ========================================================================== */

const TRIP_DATE = new Date(2026, 7, 27, 0, 0, 0, 0).getTime(); // 2026-08-27

const SCENARIOS = {
  basics:     { name: '基礎萬用', emoji: '🌸', color: '#FF5A5F' },
  repair:     { name: '修復策略', emoji: '🛟', color: '#F5A623' },
  restaurant: { name: '餐廳',     emoji: '🍜', color: '#E8503A' },
  shopping:   { name: '購物',     emoji: '🛍️', color: '#C86FC9' },
  transport:  { name: '交通',     emoji: '🚃', color: '#2E86AB' },
  hotel:      { name: '飯店',     emoji: '🏨', color: '#3AA76D' },
  kanji:      { name: '招牌漢字', emoji: '🈶', color: '#6B5B95' }
};

/* 首頁六大情境環（basics 與 repair 合併顯示為「基礎萬用」） */
const SCENARIO_GROUPS = [
  { key: 'basics',     label: '基礎萬用', emoji: '🌸', members: ['basics', 'repair'] },
  { key: 'restaurant', label: '餐廳',     emoji: '🍜', members: ['restaurant'] },
  { key: 'shopping',   label: '購物',     emoji: '🛍️', members: ['shopping'] },
  { key: 'transport',  label: '交通',     emoji: '🚃', members: ['transport'] },
  { key: 'hotel',      label: '飯店',     emoji: '🏨', members: ['hotel'] },
  { key: 'kanji',      label: '招牌漢字', emoji: '🈶', members: ['kanji'] }
];

const RAW_CARDS = {
  /* ---------------- basics 基礎萬用 ---------------- */
  basics: {

<script>
/* ==========================================================================
   跨裝置同步（同步碼，無帳號）

   設計前提：localStorage 永遠是唯一的真實來源，雲端只是同步層。
   沒網路、沒設定同步碼時，App 的行為跟完全沒有這個檔案一模一樣 ——
   人在東京、地下街收不到訊號的時候，學習流程一秒都不能被擋住。
   ========================================================================== */

/* 去掉容易看錯的 0 O 1 I l */
const SYNC_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const SYNC_CODE_LEN = 12;

function syncConfigured() {
  return typeof SUPABASE_URL === 'string' && SUPABASE_URL.length > 0
      && typeof SUPABASE_ANON_KEY === 'string' && SUPABASE_ANON_KEY.length > 0;
}
function syncEnabled() {
  return syncConfigured() && S.sync && S.sync.code;
}

function newSyncCode() {
  const bytes = new Uint8Array(SYNC_CODE_LEN);
  crypto.getRandomValues(bytes);
  let out = '';
  for (let i = 0; i < bytes.length; i++) out += SYNC_ALPHABET[bytes[i] % SYNC_ALPHABET.length];
  return out;
}
function prettyCode(code) {
  return code ? code.replace(/(.{4})(?=.)/g, '$1-') : '';
}
function normalizeCode(s) {
  return (s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}

async function rpc(fn, body) {
  const res = await fetch(SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('伺服器回應 ' + res.status);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

/* --------------------------------------------------------------------------
   合併：兩台裝置各練各的也不能弄丟任何一邊的紀錄
   -------------------------------------------------------------------------- */
function mergeState(local, remote) {
  if (!remote || typeof remote !== 'object' || !remote.cards) return local;
  const out = JSON.parse(JSON.stringify(local));

  // 卡片：逐張取「最近複習過」的那份；盤點結果只要有一邊做過就算數
  Object.keys(remote.cards).forEach(id => {
    const r = remote.cards[id];
    const l = out.cards[id];
    if (!l) { out.cards[id] = r; return; }
    if ((r.lastReviewed || 0) > (l.lastReviewed || 0)) out.cards[id] = r;
    const merged = out.cards[id];
    if ((r.triaged || l.triaged) && !merged.triaged) {
      merged.triaged = true;
      merged.seed = merged.seed || r.seed || l.seed || null;
    }
  });

  // 每日紀錄：以日期聯集，同一天以本機為準
  Object.keys(remote.days || {}).forEach(k => { if (!out.days[k]) out.days[k] = remote.days[k]; });

  // streak：採用 lastDay 較晚的那份，best 取大、補簽卡取小（保守）
  const rs = remote.streak, ls = out.streak;
  if (rs) {
    const takeRemote = rs.lastDay && (!ls.lastDay || rs.lastDay > ls.lastDay);
    out.streak = Object.assign({}, takeRemote ? rs : ls);
    out.streak.best = Math.max(ls.best || 0, rs.best || 0);
    out.streak.freezes = Math.min(
      typeof ls.freezes === 'number' ? ls.freezes : 2,
      typeof rs.freezes === 'number' ? rs.freezes : 2
    );
  }

  // 反思：以日期去重聯集
  const seenDay = {};
  out.reflections.forEach(r => { seenDay[r.day] = true; });
  (remote.reflections || []).forEach(r => {
    if (!seenDay[r.day]) { out.reflections.push(r); seenDay[r.day] = true; }
  });
  out.reflections.sort((a, b) => (a.day < b.day ? -1 : 1));

  // 一日東京通關紀錄：以日期＋分數去重
  const runs = {};
  (out.tokyo.runs || []).concat(((remote.tokyo || {}).runs) || [])
    .forEach(r => { runs[r.day + '|' + JSON.stringify(r.scores)] = r; });
  out.tokyo.runs = Object.keys(runs).map(k => runs[k]);

  // 盤點統計直接從卡片重算，避免兩邊相加變成重複計數
  const t = { known: 0, quick: 0, cold: 0 };
  Object.keys(out.cards).forEach(id => {
    const st = out.cards[id];
    if (!st.triaged) return;
    if (st.status === 'known') t.known++;
    else if (st.seed === 'quick') t.quick++;
    else if (st.seed === 'cold') t.cold++;
  });
  out.triage = t;

  // 課表進度以最早開始的那台為準
  if (remote.startDay && remote.startDay < out.startDay) out.startDay = remote.startDay;

  // out.sync 維持本機的（同步碼本身不從遠端覆蓋）
  return out;
}

/* --------------------------------------------------------------------------
   拉取 / 推送
   -------------------------------------------------------------------------- */
async function syncPull(codeOverride) {
  if (!syncConfigured()) throw new Error('尚未設定雲端同步');
  const code = normalizeCode(codeOverride || (S.sync && S.sync.code));
  if (!code) throw new Error('沒有同步碼');
  const remote = await rpc('pull', { p_code: code });
  if (remote) S = mergeState(S, remote);
  S.sync = S.sync || {};
  S.sync.code = code;
  S.sync.lastPull = Date.now();
  save();
  return !!remote;
}

async function syncPush() {
  if (!syncEnabled()) return false;
  await rpc('push', { p_code: S.sync.code, p_data: S });
  S.sync.lastPush = Date.now();
  save();
  return true;
}

/* 開啟 App 時拉一次；失敗完全靜音，不干擾學習 */
function syncOnOpen() {
  if (!syncEnabled()) return;
  syncPull().then(() => render()).catch(() => {});
}

/* 完成當日課程之後推一次，稍微延遲避免連續存檔一直打 */
let syncTimer = null;
function syncSoon() {
  if (!syncEnabled()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncPush().catch(() => {}); }, 1500);
}

/* 切到背景時（關 App、切換分頁）補推一次 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') syncPush().catch(() => {});
});

function agoText(ts) {
  if (!ts) return '尚未同步';
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return '剛剛';
  if (m < 60) return m + ' 分鐘前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小時前';
  return Math.floor(h / 24) + ' 天前';
}

<script>
/* ==========================================================================
   東京旅遊日語 30 天衝刺 — 應用邏輯
   ========================================================================== */

/* ---------------------------- 小工具 ---------------------------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const DAY_MS = 86400000;

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function monthKey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
function parseKey(k) { const p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function endOfToday() { return startOfToday() + DAY_MS - 1; }
function daysBetween(aKey, bKey) { return Math.round((parseKey(bKey) - parseKey(aKey)) / DAY_MS); }
function daysLeft() { return Math.max(0, Math.ceil((TRIP_DATE - startOfToday()) / DAY_MS)); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }
function sample(a, n) { return shuffle(a).slice(0, n); }

/* ---------------------------- 狀態 ---------------------------- */
const STORE_KEY = 'jp-sprint-tokyo-v1';

const STATE_VERSION = 2;

function defaultState() {
  return {
    version: STATE_VERSION,
    createdAt: Date.now(),
    startDay: dayKey(),
    cards: {},
    triage: { known: 0, quick: 0, cold: 0 },
    streak: { count: 0, best: 0, lastDay: null, freezes: 2, freezeMonth: monthKey(), frozen: [] },
    days: {},
    tokyo: { runs: [] },
    settings: { newPerDay: 8, triagePerDay: 8, romaji: true },
    reflections: []
  };
}

let S = defaultState();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // 每個子物件都取一份全新的預設值 —— Object.assign 會就地改寫第一個參數，
      // 共用同一份 defaultState() 會讓預設欄位被舊資料洗掉
      S = Object.assign(defaultState(), parsed);
      S.streak = Object.assign(defaultState().streak, parsed.streak || {});
      S.settings = Object.assign(defaultState().settings, parsed.settings || {});
      S.tokyo = Object.assign(defaultState().tokyo, parsed.tokyo || {});
      S.triage = Object.assign(defaultState().triage, parsed.triage || {});
      migrate();
    }
  } catch (e) { console.warn('讀取進度失敗，改用全新狀態', e); }
  return S;
}

/* v1 → v2：三天前置診斷改成每日盤點，diagRusty 併入 triaged / seed */
function migrate() {
  if ((S.version || 1) >= 2) return;
  const t = { known: 0, quick: 0, cold: 0 };
  Object.keys(S.cards).forEach(id => {
    const st = S.cards[id];
    if (st.status === 'known') { st.triaged = true; st.seed = null; t.known++; }
    else if (st.diagRusty || st.status === 'learning') { st.triaged = true; st.seed = 'cold'; t.cold++; }
    delete st.diagRusty;
  });
  S.triage = t;
  delete S.diag;
  S.version = STATE_VERSION;
  save();
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch (e) { toast('⚠️ 儲存失敗，瀏覽器空間可能已滿'); }
}

function cs(id) {
  if (!S.cards[id]) S.cards[id] = {
    interval: 0, repetitions: 0, easeFactor: 2.5, dueDate: null,
    status: 'new', lastReviewed: null, lapses: 0,
    triaged: false, seed: null   // seed: 'quick'（想一下才想到）| 'cold'（說不出來）
  };
  return S.cards[id];
}
function dayRec(k) {
  if (!S.days[k]) S.days[k] = {
    stages: {}, stageCount: 0, done: false, reviewed: 0, introduced: 0,
    triaged: 0, kanjiRight: 0, kanjiTotal: 0, reflection: '', dialogId: null
  };
  return S.days[k];
}

/* ---------------------------- SRS 排程引擎 ---------------------------- */
/* 依規格書實作：簡化 SM-2 ＋ 衝刺上限 */
function schedule(card, quality) {
  if (quality < 3) {
    card.repetitions = 0;
    card.interval = 1;                       // 忘記 → 明天再見
    card.lapses = (card.lapses || 0) + 1;
  } else {
    if (card.repetitions === 0) card.interval = 1;
    else if (card.repetitions === 1) card.interval = 3;   // 衝刺版：壓縮原 SM-2 的 6 天
    else card.interval = Math.round(card.interval * card.easeFactor);
    card.repetitions += 1;
  }
  card.easeFactor = Math.max(1.3,
    card.easeFactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
  // 衝刺上限：間隔不超過「距出發剩餘天數的一半」
  const dLeft = Math.ceil((TRIP_DATE - Date.now()) / 86400000);
  card.interval = Math.min(card.interval, Math.max(1, Math.floor(dLeft / 2)));
  card.dueDate = Date.now() + card.interval * 86400000;
  card.status = 'learning';
  card.lastReviewed = Date.now();
  return card;
}

function dueCardIds() {
  const end = endOfToday();
  return CARDS.filter(c => {
    const st = S.cards[c.id];
    return st && st.status === 'learning' && st.dueDate != null && st.dueDate <= end;
  }).map(c => c.id);
}

/* ---------------------------- 30 天課表 ---------------------------- */
const ALL_POOLS = ['basics', 'repair', 'restaurant', 'shopping', 'transport', 'hotel', 'kanji'];
/* 盤點已拆進每日課程，不再佔用前三天，各區塊因此各拉長為一週 */
const PHASES = [
  { key: 'A', name: '區塊 A', from: 1, to: 7, pools: ['basics', 'repair', 'restaurant'], desc: '問候／數字／時間 ＋ 餐廳' },
  { key: 'B', name: '區塊 B', from: 8, to: 14, pools: ['shopping', 'transport'], desc: '購物 ＋ 交通問路' },
  { key: 'C', name: '區塊 C', from: 15, to: 21, pools: ['hotel', 'kanji'], desc: '飯店 ＋ 招牌漢字閱讀' },
  { key: 'MIX', name: '交錯模擬', from: 22, to: 27, pools: ALL_POOLS, desc: '「一日東京」串場模擬' },
  { key: 'FINE', name: '高頻精煉', from: 28, to: 30, pools: ALL_POOLS, starOnly: true, desc: '只練高頻句 ＋ 修復策略' }
];

/* 依「已過天數 / 到出發的總跨度」等比對映到 30 天課表 */
function virtualDay() {
  const total = Math.max(1, Math.round((parseKey(dayKey(new Date(TRIP_DATE))) - parseKey(S.startDay)) / DAY_MS));
  const elapsed = Math.max(0, daysBetween(S.startDay, dayKey()));
  const p = Math.min(1, elapsed / total);
  return Math.min(30, Math.max(1, Math.floor(p * 29) + 1));
}
function currentPhase() {
  const d = virtualDay();
  return PHASES.find(p => d >= p.from && d <= p.to) || PHASES[PHASES.length - 1];
}
function tokyoUnlocked() {
  return virtualDay() >= 22 || daysLeft() <= 6;
}

/* ---------------------------- 掌握度 ---------------------------- */
function cardLevel(c) {
  const st = S.cards[c.id];
  if (!st) return 'new';
  if (st.status === 'known') return 'strong';
  if (st.repetitions >= 2 && st.interval >= 3) return 'strong';
  if (st.status === 'learning' || st.triaged) return 'weak';
  return 'new';
}
function groupStats(group) {
  const cards = CARDS.filter(c => group.members.indexOf(c.scenario) >= 0);
  const r = { strong: 0, weak: 0, new: 0, total: cards.length };
  cards.forEach(c => r[cardLevel(c)]++);
  return r;
}

/* ---------------------------- streak ---------------------------- */
function refreshFreezeMonth() {
  if (S.streak.freezeMonth !== monthKey()) {
    S.streak.freezeMonth = monthKey();
    S.streak.freezes = 2;
    save();
  }
}
function streakGap() {
  if (!S.streak.lastDay) return null;
  return daysBetween(S.streak.lastDay, dayKey());
}
function canUseFreeze() {
  const gap = streakGap();
  return gap === 2 && S.streak.freezes > 0 && S.streak.count > 0;
}
function useFreeze() {
  if (!canUseFreeze()) return;
  const missed = dayKey(new Date(startOfToday() - DAY_MS));
  S.streak.freezes--;
  S.streak.frozen.push(missed);
  S.streak.lastDay = missed;     // 補簽昨天，連續紀錄不中斷
  save();
  toast('🧊 補簽卡已使用，連續紀錄保住了！');
  render();
}
function bumpStreak() {
  const t = dayKey();
  if (S.streak.lastDay === t) return;
  const gap = S.streak.lastDay ? daysBetween(S.streak.lastDay, t) : null;
  S.streak.count = (gap === 1) ? S.streak.count + 1 : 1;
  S.streak.lastDay = t;
  S.streak.best = Math.max(S.streak.best || 0, S.streak.count);
}
/* 開啟時檢查是否已斷簽（間隔 >2 天且沒補簽） */
function checkStreakBroken() {
  const gap = streakGap();
  if (gap != null && gap > 2) S.streak.count = 0;
}

/* ---------------------------- 每日內容組裝 ---------------------------- */
function poolCards(phase) {
  let list = CARDS.filter(c => phase.pools.indexOf(c.scenario) >= 0);
  if (phase.starOnly) {
    const stars = list.filter(c => c.star);
    if (stars.length) list = stars;
  }
  return list;
}

/* 當前階段卡池裡還沒盤點過的卡 */
function untriagedInPool(phase) {
  return poolCards(phase).filter(c => { const st = S.cards[c.id]; return !st || !st.triaged; });
}

/* 今日盤點清單：只抽今天主題的卡，高頻優先 */
function buildTriage(phase) {
  const pool = shuffle(untriagedInPool(phase)).sort((a, b) => (b.star ? 1 : 0) - (a.star ? 1 : 0));
  return pool.slice(0, S.settings.triagePerDay).map(c => c.id);
}

function newCardsToday(phase, dueCount, exclude) {
  const rec = dayRec(dayKey());
  const limit = (dueCount > 25 ? 4 : S.settings.newPerDay) - rec.introduced;
  if (limit <= 0) return [];
  const skip = exclude || [];
  const pool = poolCards(phase).filter(c => {
    const st = S.cards[c.id];
    return (!st || st.status === 'new') && skip.indexOf(c.id) < 0;
  });
  // 已盤點的優先（使用者確認過不會），其次高頻卡
  const rank = c => {
    const st = S.cards[c.id];
    return (st && st.triaged ? 0 : 2) + (c.star ? 0 : 1);
  };
  pool.sort((a, b) => rank(a) - rank(b));
  return pool.slice(0, limit);
}

function buildWarmup() {
  const yStart = startOfToday() - DAY_MS, yEnd = startOfToday() - 1;
  let pool = CARDS.filter(c => {
    const st = S.cards[c.id];
    return st && st.lastReviewed && st.lastReviewed >= yStart && st.lastReviewed <= yEnd;
  });
  if (pool.length < 4) {
    const extra = CARDS.filter(c => {
      const st = S.cards[c.id];
      return st && st.status !== 'new' && pool.indexOf(c) < 0;
    });
    pool = pool.concat(sample(extra, 8 - pool.length));
  }
  if (pool.length < 4) return [];
  const picked = sample(pool, Math.min(5, pool.length));
  return picked.map(c => {
    const distractPool = CARDS.filter(x => x.id !== c.id && x.type === c.type);
    const wrong = sample(distractPool.length >= 3 ? distractPool : CARDS.filter(x => x.id !== c.id), 3);
    return { card: c, options: shuffle([c].concat(wrong)) };
  });
}

function buildSrsQueue(phase, excludeIds) {
  const due = dueCardIds();
  const newOnes = newCardsToday(phase, due.length, excludeIds).map(c => c.id);
  newOnes.forEach(id => {
    const st = cs(id);
    st.status = 'learning';
    st.dueDate = Date.now();
    // 盤點時選「想一下才想到」→ 跳過最初一輪，第一次答對就直接排到 3 天後
    if (st.seed === 'quick' && st.repetitions === 0) st.repetitions = 1;
  });
  if (newOnes.length) { dayRec(dayKey()).introduced += newOnes.length; save(); }

  let queue = shuffle(due).concat(newOnes);

  // 末期交錯：已標記「已經會了」的卡隨機抽查
  if (phase.key === 'MIX' || phase.key === 'FINE') {
    const known = CARDS.filter(c => S.cards[c.id] && S.cards[c.id].status === 'known');
    sample(known, Math.min(3, known.length)).forEach(c => queue.push(c.id));
  }
  return queue.map(id => ({ id: id, isNew: newOnes.indexOf(id) >= 0, isSpot: S.cards[id].status === 'known' }));
}

function pickDialogue(phase) {
  let pool = DIALOGUES.filter(d => phase.pools.indexOf(d.scenario) >= 0);
  if (!pool.length) pool = DIALOGUES;
  return pool[virtualDay() % pool.length];
}

function buildKanjiQuiz(phase) {
  const all = CARDS.filter(c => c.scenario === 'kanji');
  const rank = c => {
    const st = S.cards[c.id];
    if (st && st.status === 'learning') return 0;
    if (c.star) return 1;
    return phase.key === 'C' || phase.key === 'MIX' || phase.key === 'FINE' ? 2 : 3;
  };
  const ordered = shuffle(all).sort((a, b) => rank(a) - rank(b));
  return ordered.slice(0, 6).map(c => {
    const wrong = sample(all.filter(x => x.id !== c.id), 3);
    return { card: c, options: shuffle([c].concat(wrong)) };
  });
}

/* 從一句答案裡找出對應的卡片（用來把對話自評餵回 SRS） */
function linkedCards(jp) {
  return CARDS.filter(c => c.jp.indexOf('〜') < 0 && c.jp.length >= 4 && jp.indexOf(c.jp) >= 0);
}

/* ---------------------------- 每日課程 ---------------------------- */
const STAGE_DEF = {
  triage:  { name: '今日盤點', emoji: '📋', mins: 2 },
  warmup:  { name: '暖身',     emoji: '☀️', mins: 3 },
  srs:     { name: '主複習',   emoji: '🎴', mins: 8 },
  dialog:  { name: '情境對話', emoji: '🗣️', mins: 13 },
  kanji:   { name: '漢字快閃', emoji: '🈶', mins: 3 },
  reflect: { name: '反思',     emoji: '✍️', mins: 1 }
};

function startLesson() {
  const phase = currentPhase();
  const due = dueCardIds();
  const triage = buildTriage(phase);
  const warmup = buildWarmup();
  const srs = buildSrsQueue(phase, triage);   // 今天要盤點的卡不重複當新卡出現
  const kanji = buildKanjiQuiz(phase);

  // 只把有內容的關卡排進今天的流程
  const stages = [];
  if (triage.length) stages.push('triage');
  if (warmup.length) stages.push('warmup');
  if (srs.length) stages.push('srs');
  stages.push('dialog');
  if (kanji.length) stages.push('kanji');
  stages.push('reflect');

  L = {
    phase: phase, stages: stages,
    stage: 0, idx: 0, flipped: false, picked: null, revealed: false,
    triage: triage, warmup: warmup, srs: srs, kanji: kanji,
    dialog: pickDialogue(phase),
    stats: { warmupRight: 0, warmupTotal: 0, srsDone: 0, kanjiRight: 0, kanjiTotal: 0, dialogDone: 0, triaged: 0 },
    overload: due.length > 25
  };

  rec.dialogId = L.dialog.id;

function lessonBar() {

/* --- 0. 今日盤點 --------------------------------------------------------
   關鍵設計：不論想不想得起來，答案都會翻出來。
   所以盤點同時是一次曝光，不是純考試。                                    */
function stageTriage() {
  if (L.idx >= L.triage.length) {
    const left = untriagedInPool(L.phase).length;
    return doneBlock(`盤點完成 ${L.triage.length} 張 📋`,
      left ? `這個主題還有 ${left} 張，明天的課程會繼續盤。` : '這個主題全部盤完了，接下來就專心複習 👌');
  }
  const c = CARD_BY_ID[L.triage[L.idx]];
  const sc = SCENARIOS[c.scenario];
  const intro = L.idx === 0
    ? `<div class="intro">📋 <b>今日盤點</b><br><span class="muted">先確認你已經會什麼。想不出來完全沒關係 —— 答案一定會翻給你看。</span></div>`
    : '';
  return `
  ${intro}
  <div class="counter-line">${L.idx + 1} / ${L.triage.length}</div>
  <div class="flip ${L.flipped ? 'flipped' : ''}" data-act="flip">

function importJSON(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const obj = JSON.parse(fr.result);
      if (!obj || typeof obj !== 'object' || !('cards' in obj)) throw new Error('格式不符');
      S = Object.assign(defaultState(), obj);
      save(); toast('備份已還原 ✅'); go('home');
    } catch (e) { toast('❌ 匯入失敗：' + e.message); }
  };
  fr.readAsText(file);
}

/* ---------------------------- 錄音（自我對照用） ---------------------------- */
let REC = { mr: null, chunks: [], url: null, on: false };
function recSupported() {
  return typeof MediaRecorder !== 'undefined' && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
}
function recorderUI() {
  if (!recSupported()) return '';
  return `<div class="rec">
    <button class="btn rec-btn ${REC.on ? 'recording' : ''}" data-act="rec">${REC.on ? '⏹ 停止錄音' : '🎙️ 錄下自己'}</button>
    ${REC.url ? `<audio class="audio" controls src="${REC.url}"></audio>` : ''}
  </div>`;
}
async function toggleRec() {
  if (REC.on) {
    REC.mr && REC.mr.state !== 'inactive' && REC.mr.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    REC.chunks = [];
    const mr = new MediaRecorder(stream);
    mr.ondataavailable = e => e.data.size && REC.chunks.push(e.data);
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      if (REC.url) URL.revokeObjectURL(REC.url);
      REC.url = URL.createObjectURL(new Blob(REC.chunks, { type: mr.mimeType || 'audio/webm' }));
      REC.on = false; REC.mr = null; render();
    };
    REC.mr = mr; REC.on = true;
    mr.start(); render();
  } catch (e) { toast('無法使用麥克風（可能未授權）'); }
}
function clearRec() {
  if (REC.on && REC.mr && REC.mr.state !== 'inactive') REC.mr.stop();
  if (REC.url) { URL.revokeObjectURL(REC.url); REC.url = null; }
  REC.on = false;
}

/* ==========================================================================
   事件
   ========================================================================== */
const ACTIONS = {
  'go-home': () => { clearRec(); go('home'); },
  'go-browse': () => go('browse'),
  'go-backup': () => go('backup'),
  'filter': (el) => { browseFilter = el.dataset.k; render(); },
  'freeze': useFreeze,

  'startLesson': startLesson,
  'quitLesson': () => { clearRec(); if (confirm('離開今日課程？已完成的部分會保留。')) go('home'); },
  'nextStage': nextStage,

  'triagePick': (el) => {
    const v = el.dataset.v;
    const st = cs(L.triage[L.idx]);
    st.triaged = true;
    if (v === 'known') {
      st.status = 'known'; st.dueDate = null; st.seed = null;
    } else {
      // 進 SRS 候補池，實際排入由 30 天課表按階段每天釋出
      st.status = 'new'; st.dueDate = null; st.seed = v;
      st.interval = 0; st.repetitions = 0;
    }
    S.triage[v]++;
    dayRec(dayKey()).triaged++;
    L.stats.triaged++;
    L.idx++; L.flipped = false;
    save(); render();
  },

  'warmupPick': (el) => {
    if (L.picked) return;
    const q = L.warmup[L.idx];
    L.picked = el.dataset.id;
    L.stats.warmupTotal++;
    if (L.picked === q.card.id) L.stats.warmupRight++;
    render();
  },
  'warmupNext': () => { L.idx++; L.picked = null; render(); },

  'flip': () => { if (!L.flipped) { L.flipped = true; render(); } },
  'srsGrade': (el) => {
    const q = +el.dataset.q;
    const item = L.srs[L.idx];
    const st = cs(item.id);
    if (st.status === 'known' && q >= 3) {
      st.lastReviewed = Date.now();            // 抽查通過 → 維持 known，不進 SRS
    } else {
      schedule(st, q);                          // 抽查失手 → 轉入 SRS
    }
    L.stats.srsDone++;
    dayRec(dayKey()).reviewed++;
    L.idx++; L.flipped = false;
    save(); render();
  },

  'reveal': () => { L.revealed = true; render(); },
  'dialogGrade': (el) => {
    const q = +el.dataset.q;
    const step = L.dialog.steps[L.idx];
    linkedCards(step.answer.jp).forEach(c => {
      const st = cs(c.id);
      if (st.status === 'known' && q >= 3) return;
      schedule(st, q);
      dayRec(dayKey()).reviewed++;
    });
    L.stats.dialogDone++;
    L.idx++; L.revealed = false; clearRec();
    save(); render();
  },

  'kanjiPick': (el) => {
    if (L.picked) return;
    const q = L.kanji[L.idx];
    L.picked = el.dataset.id;
    L.stats.kanjiTotal++;
    const rec = dayRec(dayKey());
    rec.kanjiTotal++;
    if (L.picked === q.card.id) { L.stats.kanjiRight++; rec.kanjiRight++; }
    else { schedule(cs(q.card.id), 0); }        // 答錯 → 自動加入 SRS，明天再見
    save(); render();
  },
  'kanjiNext': () => { L.idx++; L.picked = null; render(); },

  'saveReflect': (el) => {
    const input = $('#reflect-input');
    const rec = dayRec(dayKey());
    if (!el.dataset.skip && input && input.value.trim()) {
      rec.reflection = input.value.trim();
      S.reflections.push({ day: dayKey(), text: rec.reflection });
    }
    nextStage();
  },

  'startTokyo': startTokyo,
  'tokyoReveal': () => { T.revealed = true; render(); },
  'tokyoGrade': (el) => {
    const q = +el.dataset.q;
    const step = T.flat[T.i].step;
    T.scores.push(q);
    linkedCards(step.answer.jp).forEach(c => {
      const st = cs(c.id);
      if (st.status === 'known' && q >= 3) return;
      schedule(st, q);
    });
    T.i++; T.revealed = false; clearRec();
    save(); render();
  },
  'tokyoDone': () => {
    S.tokyo.runs.push({ day: dayKey(), scores: T.scores });
    save(); clearRec(); go('home');
  },

  'syncEnable': () => {
    S.sync = { code: newSyncCode(), lastPush: 0, lastPull: 0 };
    save(); render();
    syncPush().then(() => { toast('同步碼已建立，進度已上傳 ☁️'); render(); })
              .catch(e => toast('⚠️ 上傳失敗：' + e.message));
  },
  'syncNow': () => {
    toast('同步中…');
    syncPull().then(syncPush)
      .then(() => { toast('同步完成 ✅'); render(); })
      .catch(e => toast('⚠️ 同步失敗：' + e.message));
  },
  'syncCopy': () => {
    const code = S.sync && S.sync.code;
    if (!code) return;
    const done = () => toast('同步碼已複製 📋');
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(done).catch(() => toast(code));
    else toast(code);
  },
  'syncLink': () => {
    const input = $('#sync-input');
    const code = normalizeCode(input && input.value);
    if (code.length !== SYNC_CODE_LEN) return toast('同步碼格式不對（應為 12 碼）');
    toast('接續中…');
    syncPull(code)
      .then(found => {
        if (!found) return toast('⚠️ 找不到這組同步碼，請再確認一次');
        return syncPush().then(() => { toast('已接續並合併進度 ✅'); render(); });
      })
      .catch(e => toast('⚠️ 接續失敗：' + e.message));
  },

  'export': exportJSON,
  'importClick': () => $('#import-file').click(),
  'reset': () => {
    if (!confirm('確定清除所有進度？此動作無法復原。')) return;
    if (!confirm('再確認一次：全部歸零，從 Day 1 重新開始。')) return;
    localStorage.removeItem(STORE_KEY);
    S = defaultState(); save(); go('home');
  },
  'rec': toggleRec
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el); }
});

function afterRender() {
  const f = $('#import-file');
  if (f) f.onchange = () => { if (f.files[0]) importJSON(f.files[0]); };
  const rt = $('#romaji-toggle');
  if (rt) rt.onchange = () => { S.settings.romaji = rt.checked; save(); toast('已更新'); };
  const np = $('#newperday');
  if (np) np.onchange = () => { S.settings.newPerDay = +np.value; save(); toast('每日新卡：' + np.value + ' 張'); };
  const tp = $('#triageperday');
  if (tp) tp.onchange = () => { S.settings.triagePerDay = +tp.value; save(); toast('每日盤點：' + tp.value + ' 張'); };
  const ri = $('#reflect-input');
  if (ri) ri.addEventListener('keydown', e => { if (e.key === 'Enter') ACTIONS.saveReflect($('[data-act="saveReflect"]')); });
}

/* ---------------------------- 啟動 ---------------------------- */
load();
refreshFreezeMonth();
checkStreakBroken();
save();
render();
syncOnOpen();

</script>
</body>
</html>
